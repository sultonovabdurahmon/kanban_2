<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Вазифаи нав — Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3.3 аз CDN; integrity аз иваз шудани файл ҳимоя мекунад -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark app-navbar">
  <div class="container">
    <a class="navbar-brand" href="layout.html">📋 Kanban</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav"
            aria-controls="mainNav" aria-expanded="false" aria-label="Кушодани меню">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="mainNav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="layout.html">Асосӣ</a></li>
        <li class="nav-item"><a class="nav-link active" aria-current="page" href="tasks.html">Вазифаҳо</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Тахтаҳо</a></li>
        <li class="nav-item"><a class="nav-link" href="#">Мӯҳлатҳо</a></li>
      </ul>
      <div class="d-flex align-items-center gap-2 text-white">
        <span>Каримов Шоҳрух</span>
        <span class="badge kb-role kb-role-manager">Роҳбар</span>
        <a class="btn btn-sm btn-outline-light" href="login.html">Баромад</a>
      </div>
    </div>
  </div>
</nav>

<main class="container py-4">
  <nav aria-label="Занҷираи навигатсия">
    <ol class="breadcrumb">
      <li class="breadcrumb-item"><a href="tasks.html">Вазифаҳо</a></li>
      <li class="breadcrumb-item active" aria-current="page">Вазифаи нав</li>
    </ol>
  </nav>
  <h1 class="mb-3">Вазифаи нав</h1>

  <!-- Дар ин шакл novalidate НЕСТ: паёмҳои стандартии браузер кор мекунанд (муқоиса бо register.html) -->
  <form class="card card-body" method="post" action="/tasks/create" enctype="multipart/form-data">
    <div class="mb-3">
      <label class="form-label" for="task-title">Ном *</label>
      <input class="form-control" type="text" id="task-title" name="title" required maxlength="200">
    </div>
    <div class="row g-3 mb-3">
      <div class="col-12 col-md-6">
        <label class="form-label" for="task-project">Лоиҳа *</label>
        <select class="form-select" id="task-project" name="project_id" required>
          <option value="">Лоиҳаро интихоб кунед</option>
          <option value="1">Сомонаи мағозаи КОРД</option>
          <option value="2">Барномаи мобилӣ</option>
        </select>
      </div>
      <div class="col-12 col-md-6">
        <label class="form-label" for="task-assignee">Иҷрокунанда</label>
        <select class="form-select" id="task-assignee" name="assignee_id">
          <option value="">Таъин нашудааст</option>
          <option value="2">Раҳимов Фарҳод</option>
          <option value="3">Назарова Мадина</option>
        </select>
      </div>
      <div class="col-12 col-sm-6">
        <label class="form-label" for="task-due">Мӯҳлат</label>
        <input class="form-control" type="date" id="task-due" name="due_date" min="2026-01-01">
      </div>
      <div class="col-12 col-sm-6">
        <label class="form-label" for="task-priority">Афзалият *</label>
        <select class="form-select" id="task-priority" name="priority" required>
          <option value="">Интихоб кунед</option>
          <option value="high">Баланд</option>
          <option value="medium">Миёна</option>
          <option value="low">Паст</option>
        </select>
      </div>
    </div>
    <div class="mb-3">
      <label class="form-label" for="task-description">Тавсиф</label>
      <textarea class="form-control" id="task-description" name="description" rows="3" maxlength="1000"></textarea>
    </div>
    <div class="mb-3">
      <label class="form-label" for="task-file">Замима (то 5 МБ)</label>
      <input class="form-control" type="file" id="task-file" name="file" accept=".jpg,.jpeg,.png,.gif,.pdf,.doc,.docx,.xls,.xlsx,.txt,.zip">
    </div>
    <div class="d-flex flex-wrap gap-2 justify-content-end">
      <a class="btn btn-outline-secondary" href="tasks.html">Бекор кардан</a>
      <button class="btn btn-primary" type="submit">Сохтан</button>
    </div>
  </form>
</main>

<footer class="app-footer container py-4 text-center">
  Kanban · идоракунии вазифаҳои даста · 2026
</footer>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
