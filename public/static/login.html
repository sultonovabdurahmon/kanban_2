<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Воридшавӣ — Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3.3 аз CDN; integrity аз иваз шудани файл ҳимоя мекунад -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="login-wrap">
  <section class="card login-card" aria-labelledby="login-title">
    <div class="card-body p-4">
      <p class="login-brand mb-1">📋 Kanban</p>
      <h1 id="login-title" class="h4 mb-4">Воридшавӣ</h1>
      <form method="post" action="login.html">
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input class="form-control" type="email" id="email" name="email" autocomplete="username" placeholder="karimov@example.tj">
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Парол</label>
          <input class="form-control" type="password" id="password" name="password" autocomplete="current-password">
        </div>
        <div class="d-grid"><button class="btn btn-primary" type="submit">Ворид шудан</button></div>
      </form>
      <p class="text-muted text-center mt-3 mb-0">Ҳисоб надоред? <a href="#">Сабти ном</a></p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>
</html>
