<!doctype html>
<html lang="tg">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Сабти ном — Kanban</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <!-- Bootstrap 5.3.3 аз CDN; integrity аз иваз шудани файл ҳимоя мекунад -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link href="../assets/css/app.css" rel="stylesheet">
</head>
<body>
<main class="login-wrap">
  <section class="card login-card" aria-labelledby="register-title">
    <div class="card-body p-4">
      <p class="login-brand mb-1">📋 Kanban</p>
      <h1 id="register-title" class="h4 mb-4">Сабти ном</h1>
      <!-- novalidate: «ҳубобчаҳои» браузер хомӯшанд, паёмҳоро app.js нишон медиҳад.
           Сервер (PHP) ба ҳар ҳол ҳар майдонро аз нав месанҷад! -->
      <form id="register-form" method="post" action="/register" novalidate>
        <div class="mb-3">
          <label class="form-label" for="reg-name">Ном ва насаб *</label>
          <input class="form-control" type="text" id="reg-name" name="name" required maxlength="100" autocomplete="name" aria-describedby="reg-name-error">
          <div class="invalid-feedback" id="reg-name-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="reg-email">Email *</label>
          <input class="form-control" type="email" id="reg-email" name="email" required maxlength="150" autocomplete="email" aria-describedby="reg-email-error">
          <div class="invalid-feedback" id="reg-email-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="reg-password">Парол * (на камтар аз 6 аломат)</label>
          <input class="form-control" type="password" id="reg-password" name="password" required minlength="6" autocomplete="new-password" aria-describedby="reg-password-error">
          <div class="invalid-feedback" id="reg-password-error"></div>
        </div>
        <div class="mb-3">
          <label class="form-label" for="reg-password-confirm">Такрори парол *</label>
          <input class="form-control" type="password" id="reg-password-confirm" name="password_confirm" required autocomplete="new-password" aria-describedby="reg-password-confirm-error">
          <div class="invalid-feedback" id="reg-password-confirm-error"></div>
        </div>
        <div class="d-grid"><button class="btn btn-primary" type="submit">Сабти ном</button></div>
      </form>
      <p class="text-muted text-center mt-3 mb-0">Ҳисоб доред? <a href="login.html">Ворид шудан</a></p>
    </div>
  </section>
</main>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
<script type="module" src="../assets/js/app.js"></script>
</body>
</html>
